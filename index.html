<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="João Vinicius Rodrigues — Full Stack Developer | Data &amp; AI" />
    <meta name="author" content="João Vinicius Rodrigues" />
    <title>João Vinicius — Portfolio</title>
    <!-- SPA redirect: decodes the path encoded by 404.html -->
    <script>
      (function () {
        var p = new URLSearchParams(window.location.search).get('p');
        if (p) {
          var q = new URLSearchParams(window.location.search).get('q');
          window.history.replaceState(null, null, '/' + p + (q ? '?' + q : '') + window.location.hash);
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
